name: ${COMPOSE_PROJECT:-scampause-prod}

x-defaults: &defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-scampause}
  DB_USERNAME: ${POSTGRES_USER:-app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/env/.env.compose (npm run env:sync -- --prod)}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  WORKER_URL: http://worker:8301
  AI_URL: http://worker:8301

x-web: &web
  <<: *defaults
  image: ${COMPOSE_PROJECT:-scampause-prod}-web:latest
  build:
    context: .
    dockerfile: infra/docker/web.Dockerfile
  env_file:
    - path: infra/env/.env.web
      required: true
  environment:
    <<: *db-env
  volumes:
    - web-storage:/app/storage/app

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/env/.env.compose}
      POSTGRES_DB: ${POSTGRES_DB:-scampause}
      EXTRA_DB_SUFFIXES: ""
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  web-migrate:
    <<: *web
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      disable: true

  web:
    <<: *web
    depends_on:
      web-migrate: { condition: service_completed_successfully }
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${WEB_PUBLIC_PORT:-8080}:8080"

  scheduler:
    <<: *web
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      web-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3

  worker:
    <<: *defaults
    image: ${COMPOSE_PROJECT:-scampause-prod}-worker:latest
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - path: infra/env/.env.worker
        required: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-scampause}
      REDIS_URL: redis://redis:6379
      WEB_URL: http://web:8080
      AI_URL: http://127.0.0.1:8301
      HOST: 0.0.0.0
      PORT: "8301"
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${WORKER_PUBLIC_PORT:-8081}:8301"
    depends_on:
      web: { condition: service_healthy }
      redis: { condition: service_healthy }

  mailpit:
    <<: *defaults
    image: axllent/mailpit:latest
    profiles: ["sandbox"]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8025:8025"

volumes:
  pgdata:
  redisdata:
  web-storage:
